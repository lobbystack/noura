name: CI

# Branch protection requires one check, `CI passed`, which fails when any
# job fails and counts a skipped job as passing. `changes` decides what runs:
# .github/scripts/ci-changes.sh and CONTRIBUTING.md describe the rules.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Tests of these crates run on Linux only. Their code has no
  # platform-specific branch, and their tests read only checked-in
  # fixtures; CONTRIBUTING.md has the rule. A new crate runs everywhere
  # until it joins this list.
  LINUX_ONLY_TESTS: >-
    package(workspace-format) | package(sync-protocol) |
    package(sync-key-envelope) | package(sync-store) | package(account-web) |
    package(plugin-sdk) | package(s7-rust-hello) |
    package(kit-plugin) | package(misbehave-plugin) | package(probe-plugin) |
    package(recipes-plugin) | package(uses-files-plugin) | package(ai-plugin) |
    package(calendar-plugin) | package(dictation-plugin) | package(hello-plugin) |
    package(projects-plugin) | package(tasks-plugin) | package(transcription-plugin)
  # The test build optimizes dependencies, as the postgres job does. Debug
  # builds of the SIMD crypto and of SQLite made some tests 30 times slower
  # on x86-64 than on Apple silicon. Noura's crates stay unoptimized, with
  # debug assertions.
  OPTIMIZED_DEPENDENCIES: >-
    --config profile.dev.package."*".opt-level=2
    --config profile.test.package."*".opt-level=2

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      rust: ${{ steps.changes.outputs.rust }}
      website: ${{ steps.changes.outputs.website }}
      warm: ${{ steps.changes.outputs.warm }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: changes
        run: .github/scripts/ci-changes.sh
        env:
          GH_TOKEN: ${{ github.token }}

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: gitleaks.toml
          GITLEAKS_VERSION: 8.30.1

  website:
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: 1.3.14 }
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run check:website
      - run: bun run build:website

  # Formatting and Clippy on each platform, since some code compiles on one
  # platform only.
  lint:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install the Linux build libraries
        if: runner.os == 'Linux'
        run: scripts/install-linux-build-deps.sh
      # rustup reads the version and components from rust-toolchain.toml.
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - run: rustc --version
      # rav1d, which decodes AVIF images in notes, assembles its x86 code
      # with NASM, and its build script runs under Clippy too.
      - name: Install NASM
        if: runner.os != 'macOS'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            choco install nasm --no-progress -y
            echo 'C:\Program Files\NASM' >> "$GITHUB_PATH"
          else
            sudo apt-get update && sudo apt-get install -y nasm
          fi
      - name: Keep Defender out of the build folders
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, "$env:USERPROFILE\.cargo", "$env:USERPROFILE\.rustup"
      - if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked --keep-going -- -D warnings

  # Builds the workspace and its tests once per platform, runs the
  # TypeScript author kit's tests and the doctests, and hands the `test`
  # shards a nextest archive with the plugins the tests load. Only main
  # saves the cache, so pull requests restore main's instead of evicting it.
  build:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.warm == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install the Linux build libraries
        if: runner.os == 'Linux'
        run: scripts/install-linux-build-deps.sh
      - name: Install the pinned Rust toolchain and the WebAssembly component target
        run: |
          rustup toolchain install
          rustup target add wasm32-wasip2
      - run: rustc --version
      - name: Install NASM
        if: runner.os != 'macOS'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            choco install nasm --no-progress -y
            echo 'C:\Program Files\NASM' >> "$GITHUB_PATH"
          else
            sudo apt-get update && sudo apt-get install -y nasm
          fi
      - name: Keep Defender out of the build folders
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, "$env:USERPROFILE\.cargo", "$env:USERPROFILE\.rustup"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: tests
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@76c2e6406e52637deed7160d77bded76bd83e06e # v2.87.14
        with: { tool: cargo-nextest@0.9.152 }
      - name: Build the workspace
        shell: bash
        run: |
          read -ra optimized <<< "$OPTIMIZED_DEPENDENCIES"
          cargo build --workspace --locked "${optimized[@]}"
      # Trial S7 loads a Rust and a TypeScript hello plugin in plugin-host's
      # tests. jco needs Node and npm, which AGENTS.md allows only for
      # sdk/typescript.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            sdk/typescript/s7-hello/package-lock.json
            sdk/typescript/package-lock.json
      - name: Build the trial S7 plugins
        shell: bash
        run: bash crates/plugin-host/trial/build-plugins.sh
      # Seam 5: the TypeScript author kit under Node. Its tests create,
      # build, rebuild in dev mode and package plugins, and run them in
      # the real host, noura-kit-host, which the workspace build built
      # above, and in the mock host.
      - name: Install the TypeScript author kit
        working-directory: sdk/typescript
        run: npm ci --no-audit --no-fund
      - name: Build the TypeScript author kit
        working-directory: sdk/typescript
        run: npm run build
      - name: Type-check the TypeScript author kit
        working-directory: sdk/typescript
        run: npm run check
      - name: Test the TypeScript author kit against the mock and real hosts
        working-directory: sdk/typescript
        run: npm test
        env:
          NOURA_REQUIRE_KIT_HOST: '1'
      # The hello plugin and plugin-host's test plugins, which the plugin
      # tests in plugin-host, app-core and app-ui load.
      - name: Build the plugins
        shell: bash
        run: bash crates/plugin-sdk/build-plugins.sh
      - name: Build and archive the tests
        shell: bash
        run: |
          read -ra optimized <<< "$OPTIMIZED_DEPENDENCIES"
          filter=()
          if [ "$RUNNER_OS" != Linux ]; then
            filter=(-E "not ($LINUX_ONLY_TESTS)")
          fi
          cargo nextest archive --workspace --locked --profile ci "${optimized[@]}" \
            "${filter[@]}" --archive-file nextest-archive.tar.zst
          ls -l nextest-archive.tar.zst
      # The archive holds the test binaries and the binaries they start.
      # The plugins sit beside it at the paths the tests read them from.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.changes.outputs.rust == 'true'
        with:
          name: tests-${{ runner.os }}
          path: |
            nextest-archive.tar.zst
            target/wasm32-wasip2/debug/*.wasm
            target/wasm32-wasip2/release/s7_rust_hello.wasm
            sdk/typescript/s7-hello/dist/s7-hello.wasm
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Run the doctests
        shell: bash
        run: |
          read -ra optimized <<< "$OPTIMIZED_DEPENDENCIES"
          cargo test --workspace --locked --doc "${optimized[@]}"

  # Nextest runs each test in a process of its own, with the limits in
  # .config/nextest.toml, and each shard runs every Nth test of the
  # archive. Linux runs every crate; macOS and Windows skip
  # LINUX_ONLY_TESTS.
  test:
    name: test (${{ matrix.os }}, ${{ matrix.shard }}/${{ matrix.shards }})
    needs: [changes, build]
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, shard: 1, shards: 4 }
          - { os: ubuntu-latest, shard: 2, shards: 4 }
          - { os: ubuntu-latest, shard: 3, shards: 4 }
          - { os: ubuntu-latest, shard: 4, shards: 4 }
          - { os: windows-latest, shard: 1, shards: 6 }
          - { os: windows-latest, shard: 2, shards: 6 }
          - { os: windows-latest, shard: 3, shards: 6 }
          - { os: windows-latest, shard: 4, shards: 6 }
          - { os: windows-latest, shard: 5, shards: 6 }
          - { os: windows-latest, shard: 6, shards: 6 }
          # The account runs five macOS jobs at a time.
          - { os: macos-latest, shard: 1, shards: 2 }
          - { os: macos-latest, shard: 2, shards: 2 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install the Linux libraries
        if: runner.os == 'Linux'
        run: scripts/install-linux-build-deps.sh
      # Some tests run Cargo: plugin-host's builds a plugin outside the
      # repository, and app-core's reads the dependency graph.
      - name: Install the pinned Rust toolchain and the WebAssembly component target
        run: |
          rustup toolchain install
          rustup target add wasm32-wasip2
      - name: Keep Defender out of the build folders
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, "$env:USERPROFILE\.cargo", "$env:USERPROFILE\.rustup"
      # The PostgreSQL store's tests start throwaway clusters with the
      # runner's initdb and pg_ctl and fail when PostgreSQL is missing. The
      # Linux and Windows images ship PostgreSQL; Homebrew provides it on
      # macOS.
      - name: Install PostgreSQL on macOS
        if: runner.os == 'macOS'
        run: |
          brew list postgresql@16 > /dev/null 2>&1 || brew install postgresql@16
          echo "NOURA_POSTGRES_BIN=$(brew --prefix postgresql@16)/bin" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@76c2e6406e52637deed7160d77bded76bd83e06e # v2.87.14
        with: { tool: cargo-nextest@0.9.152 }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tests-${{ runner.os }}
      # Extracting into the checkout puts every binary back at the path its
      # tests compiled in, such as CARGO_BIN_EXE_noura.
      - name: Run the tests
        shell: bash
        timeout-minutes: 60
        run: |
          filter=()
          if [ "$RUNNER_OS" != Linux ]; then
            filter=(-E "not ($LINUX_ONLY_TESTS)")
          fi
          cargo nextest run --archive-file nextest-archive.tar.zst \
            --extract-to "$WORKSPACE" --extract-overwrite --profile ci \
            --partition "slice:$SHARD/$SHARDS" "${filter[@]}"
        env:
          WORKSPACE: ${{ github.workspace }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.shards }}
          NOURA_S7_REQUIRE_PLUGINS: '1'
          NOURA_REQUIRE_PLUGINS: '1'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: junit-${{ runner.os }}-${{ matrix.shard }}
          path: target/nextest/ci/junit.xml
          retention-days: 14

  # The test runs that need a build of their own: the plugin host on
  # Wasmtime's Pulley interpreter, the collaboration sandbox on both
  # backends, the editor's large note in release mode, and the macOS
  # reports.
  extras:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.warm == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install the Linux build libraries
        if: runner.os == 'Linux'
        run: scripts/install-linux-build-deps.sh
      - name: Install the pinned Rust toolchain and the WebAssembly targets
        run: |
          rustup toolchain install
          rustup target add wasm32-wasip2 wasm32-unknown-unknown
      - run: rustc --version
      - name: Install NASM
        if: runner.os != 'macOS'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            choco install nasm --no-progress -y
            echo 'C:\Program Files\NASM' >> "$GITHUB_PATH"
          else
            sudo apt-get update && sudo apt-get install -y nasm
          fi
      - name: Keep Defender out of the build folders
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, "$env:USERPROFILE\.cargo", "$env:USERPROFILE\.rustup"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: extras
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdk/typescript/s7-hello/package-lock.json
      - name: Build the trial S7 plugins
        shell: bash
        run: bash crates/plugin-host/trial/build-plugins.sh
      - name: Build the plugins
        shell: bash
        run: bash crates/plugin-sdk/build-plugins.sh
      # The plugin host's seam 3 suite again on Wasmtime's Pulley
      # interpreter, which a future mobile host runs instead of native code.
      - name: Run the plugin host's tests on the Pulley interpreter
        run: cargo test -p plugin-host --features pulley --locked
        env:
          NOURA_S7_REQUIRE_PLUGINS: '1'
          NOURA_REQUIRE_PLUGINS: '1'
      # Linux runs this check in the collab-sandbox job, with the checks
      # only Linux runs.
      - name: Run the collaboration sandbox on Pulley and Cranelift
        if: runner.os != 'Linux'
        shell: bash
        run: scripts/check-collab-sandbox.sh backends
      # The large note takes minutes through a debug build, so
      # `the_large_note_keeps_its_bytes` runs only in release mode.
      - name: Check that the editor keeps a large note's bytes
        run: 'cargo test -p editor-egui --release --locked --test it byte_identity::'
      # A report, not a gate: each checkpoint enforces the budget on the
      # owner's Mac.
      - name: Report the file tree's frame times
        if: runner.os == 'macOS'
        run: 'cargo test -p app-ui --release --locked --test it tree_scale:: -- --ignored --nocapture'
      - name: Report a plugin's 10,000-row list's frame times
        if: runner.os == 'macOS'
        run: 'cargo test -p app-ui --release --locked --test it plugin_kit:: -- --ignored --nocapture'
        env:
          NOURA_REQUIRE_PLUGINS: '1'
      # Also a report: the 95th-percentile keystroke-to-frame time of typing
      # in the 1 MB note, against the 16 ms budget.
      - name: Report the editor's typing time on a 1 MB note
        if: runner.os == 'macOS'
        run: cargo bench -p editor-egui --locked --bench typing

  # Release checks: build each desktop package with cargo-packager, sign it
  # with a throwaway updater key, install or mount it, and launch the app to
  # its first window. Each package has to hold the plugins that ship with
  # Noura, built for wasm32-wasip2.
  packages:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        # The release builds Linux packages on the oldest supported Ubuntu.
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install the Linux build libraries
        if: runner.os == 'Linux'
        run: scripts/install-linux-build-deps.sh --runtime
      - name: Install the pinned Rust toolchain and the WebAssembly target
        run: |
          rustup toolchain install
          rustup target add wasm32-wasip2
      # rav1d, which decodes AVIF images in notes, assembles its x86 code
      # with NASM.
      - name: Install NASM
        if: runner.os != 'macOS'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            choco install nasm --no-progress -y
            echo 'C:\Program Files\NASM' >> "$GITHUB_PATH"
          else
            sudo apt-get update && sudo apt-get install -y nasm
          fi
      - name: Keep Defender out of the build folders
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, "$env:USERPROFILE\.cargo", "$env:USERPROFILE\.rustup"
      - uses: taiki-e/install-action@76c2e6406e52637deed7160d77bded76bd83e06e # v2.87.14
        with: { tool: 'cargo-packager@0.11.8,cargo-about@0.9.2' }
      # libfuse2 runs AppImages, including the tools cargo-packager uses to
      # build one. Xvfb and Mesa give the app a display and a GPU.
      - name: Install the Linux packaging and display tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 xvfb mesa-vulkan-drivers libegl1 libxkbcommon-x11-0
      - name: Build and sign the packages
        shell: bash
        run: |
          password="$(openssl rand -hex 16)"
          cargo packager signer generate --ci --password "$password" --path "$RUNNER_TEMP/updater.key"
          export CARGO_PACKAGER_SIGN_PRIVATE_KEY="$RUNNER_TEMP/updater.key"
          export CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD="$password"
          scripts/package-desktop.sh
      - name: Check that each update bundle has a signature
        shell: bash
        run: |
          shopt -s nullglob
          bundles=(target/release/*.app.tar.gz target/release/*.msi target/release/*.AppImage)
          if [ "${#bundles[@]}" -eq 0 ]; then
            echo "::error::No update bundle was built."
            exit 1
          fi
          for bundle in "${bundles[@]}"; do
            test -s "$bundle.sig" || { echo "::error::$bundle has no signature."; exit 1; }
          done
      - name: Install each package and launch it
        timeout-minutes: 15
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a scripts/check-desktop-packages.sh
          else
            scripts/check-desktop-packages.sh
          fi

  static-server:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain and the musl target
        run: |
          rustup toolchain install
          rustup target add x86_64-unknown-linux-musl
      - run: rustc --version
      - name: Install the musl C compiler
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build -p sync-server --release --locked --target x86_64-unknown-linux-musl
      - name: Check that the server is one static binary that starts
        run: |
          binary=target/x86_64-unknown-linux-musl/release/sync-server
          file "$binary"
          program_headers="$(readelf --program-headers --wide "$binary")"
          if grep -q INTERP <<<"$program_headers"; then
            echo "::error::$binary asks for a dynamic loader."
            exit 1
          fi
          dynamic_section="$(readelf --dynamic --wide "$binary")"
          if grep -q '(NEEDED)' <<<"$dynamic_section"; then
            grep '(NEEDED)' <<<"$dynamic_section"
            echo "::error::$binary needs shared libraries."
            exit 1
          fi
          "$binary" version
      - name: Migrate, serve and pass the health check
        run: |
          binary=target/x86_64-unknown-linux-musl/release/sync-server
          data="$RUNNER_TEMP/sync-data"
          "$binary" migrate --data "$data"
          "$binary" serve --data "$data" --listen 127.0.0.1:8787 &
          server=$!
          for _ in $(seq 1 50); do
            if "$binary" healthcheck --listen 127.0.0.1:8787; then
              kill "$server"
              wait "$server" || true
              exit 0
            fi
            sleep 0.2
          done
          echo "::error::The server never passed its health check."
          exit 1
      # A hosted PostgreSQL usually requires TLS. This cluster refuses every
      # connection without it, and the static binary migrates and serves
      # through it.
      - name: Migrate and serve on a PostgreSQL that requires TLS
        run: |
          binary="$PWD/target/x86_64-unknown-linux-musl/release/sync-server"
          bin="$(pg_config --bindir 2> /dev/null || ls -d /usr/lib/postgresql/*/bin | sort -V | tail -n 1)"
          cluster="$RUNNER_TEMP/tls-cluster"
          "$bin/initdb" -D "$cluster" -A trust -U postgres --no-sync > /dev/null
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes -days 2 \
            -subj /CN=localhost -keyout "$cluster/server.key" -out "$cluster/server.crt" 2> /dev/null
          chmod 600 "$cluster/server.key"
          {
            echo "port = 54329"
            echo "listen_addresses = '127.0.0.1'"
            echo "unix_socket_directories = ''"
            echo "ssl = on"
          } >> "$cluster/postgresql.conf"
          printf 'hostssl all all 127.0.0.1/32 trust\nhostnossl all all 127.0.0.1/32 reject\n' > "$cluster/pg_hba.conf"
          "$bin/pg_ctl" -D "$cluster" -l "$RUNNER_TEMP/tls-cluster.log" -w start
          export NOURA_DATABASE_URL="postgres://postgres@127.0.0.1:54329/postgres?sslmode=require"
          export NOURA_SERVER_SECRET="$(openssl rand -hex 32)"
          data="$RUNNER_TEMP/tls-data"
          if NOURA_DATABASE_URL="${NOURA_DATABASE_URL/sslmode=require/sslmode=disable}" "$binary" migrate --data "$data"; then
            echo "::error::The cluster took a connection without TLS."
            exit 1
          fi
          "$binary" migrate --data "$data"
          "$binary" serve --data "$data" --listen 127.0.0.1:8788 &
          server=$!
          for _ in $(seq 1 50); do
            if "$binary" healthcheck --listen 127.0.0.1:8788; then
              kill "$server"
              wait "$server" || true
              "$bin/pg_ctl" -D "$cluster" -m fast -w stop
              exit 0
            fi
            sleep 0.2
          done
          echo "::error::The server on PostgreSQL never passed its health check."
          exit 1

  # The image the self-hosting guide and the Dokploy compose file run. On
  # main it also goes to GitHub's container registry, where sync.noura.app
  # pulls it, so the Dokploy host never compiles Rust.
  server-image:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: scripts/check-server-image.sh
      - name: Publish the image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/noura-sync-server
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker tag noura-sync-server "$IMAGE:main"
          docker tag noura-sync-server "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:main"
          docker push "$IMAGE:$GITHUB_SHA"

  # Both stores' queries are checked at compile time against offline data in
  # crates/sync-store-sqlite/.sqlx and crates/sync-store-postgres/.sqlx, so
  # builds need no database. This job rebuilds that data from the
  # migrations, PostgreSQL's in the service below, and fails when it changed.
  sqlx-offline-data:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - run: rustc --version
      - name: Install the SQLite command-line tool
        run: sudo apt-get update && sudo apt-get install -y sqlite3
      - run: scripts/sqlx-prepare.sh --check
        env:
          SQLX_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres

  # The store conformance suite, the server's PostgreSQL mode tests and the
  # tracer on a PostgreSQL service, as a hosted deployment runs it, then the
  # push soak for five minutes. Tests that need a cluster of their own, such
  # as one that requires TLS, start it with the runner's PostgreSQL. The job
  # builds dependencies optimized, the crypto crates among them, so its
  # debug tests stay quick on a shared runner.
  postgres:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      NOURA_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432
      DEV_DEPENDENCIES: profile.dev.package."*".opt-level=2
      TEST_DEPENDENCIES: profile.test.package."*".opt-level=2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # The tests run several instances at once, each with 32 request
      # connections, as the local test clusters allow with 500.
      - name: Raise the service's connection limit
        env:
          SERVICE: ${{ job.services.postgres.id }}
        run: |
          docker exec "$SERVICE" psql -U postgres -c "ALTER SYSTEM SET max_connections = 500"
          docker restart "$SERVICE"
          for _ in $(seq 1 30); do
            if docker exec "$SERVICE" pg_isready -U postgres; then
              docker exec "$SERVICE" psql -U postgres -tAc "SHOW max_connections"
              exit 0
            fi
            sleep 1
          done
          echo "::error::The PostgreSQL service didn't come back after its restart."
          exit 1
      - name: Install the Linux build libraries
        if: runner.os == 'Linux'
        run: scripts/install-linux-build-deps.sh
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - run: rustc --version
      - run: cargo test --locked --config "$DEV_DEPENDENCIES" --config "$TEST_DEPENDENCIES" -p sync-store-postgres -p sync-server
      - run: 'cargo test --locked --config "$DEV_DEPENDENCIES" --config "$TEST_DEPENDENCIES" -p app-core --test it sync:: -- --skip workspace_sync::'
      # The 500 ms bar is for the server as it ships, so the soak builds
      # Noura's own crates optimized too.
      - name: Run the push soak for five minutes
        run: 'cargo test --locked --config "$DEV_DEPENDENCIES" --config "$TEST_DEPENDENCIES" --config profile.dev.opt-level=2 --config profile.test.opt-level=2 -p sync-server --test it soak:: -- --nocapture'
        env:
          NOURA_SOAK_SECONDS: '300'

  # Review item M7: 200 real devices apply a state a restore lost, and each
  # waits by its rank for that object, so one writes it again and none gets
  # conflict_limit. The job builds dependencies optimized, as the soak does.
  restore-fleet:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DEV_DEPENDENCIES: profile.dev.package."*".opt-level=2
      TEST_DEPENDENCIES: profile.test.package."*".opt-level=2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install the Linux build libraries
        if: runner.os == 'Linux'
        run: scripts/install-linux-build-deps.sh
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - run: rustc --version
      - name: Restore with 200 devices
        run: 'cargo test --locked --config "$DEV_DEPENDENCIES" --config "$TEST_DEPENDENCIES" -p app-core --test it sync_restore::many_devices_pick_one_writer_for_a_lost_object -- --nocapture'
        env:
          NOURA_RESTORE_DEVICES: '200'

  editor-dependencies:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - run: rustc --version
      # editor-core has no UI dependency; neither editor crate reaches
      # Lockbook's crates, a git source, a mobile host library or an HTTP
      # client; the build holds one wgpu version.
      - run: scripts/check-editor-deps.sh

  sync-protocol:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain and the WebAssembly target
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
      - run: rustc --version
      # sync-protocol holds no filesystem, socket or database crate and builds
      # for account-web's WebAssembly target (sync-v2.md §4). Its published
      # test vectors and fixtures run with the workspace tests.
      - run: scripts/check-sync-protocol.sh

  # The collaboration sandbox (sync-v2.md §22). Every platform runs its
  # whole test suite twice, once on Cranelift and once on Pulley, and in
  # each run the verdict fixtures and the records at the verdict's limits
  # must reach the same verdicts and fuel on both backends: macOS and
  # Windows in the extras job, Linux here. Linux also rebuilds the guest
  # module and requires the bytes the sandbox embeds, checks that the
  # guest's yrs resolves without `small-client`, runs the guest's tests,
  # checks that the scheduled fuzz job's targets build, and runs the
  # previous release on the current fixture.
  collab-sandbox:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The release check needs the release tags.
          fetch-depth: 0
          persist-credentials: false
      - name: Install the pinned Rust toolchain and the WebAssembly target
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
      - run: rustc --version
      - name: Run the sandbox on Pulley and Cranelift
        run: scripts/check-collab-sandbox.sh backends
      - name: Check the guest module, its yrs, the fuzz targets and the previous release
        run: scripts/check-collab-sandbox.sh module features guest fuzz release

  account-web:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain and the WebAssembly target
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
      - run: rustc --version
      # The wasm-bindgen command-line tool at the version Cargo.lock pins.
      - uses: taiki-e/install-action@76c2e6406e52637deed7160d77bded76bd83e06e # v2.87.14
        with: { tool: wasm-bindgen@0.2.127 }
      - run: cargo clippy -p account-web --lib --target wasm32-unknown-unknown --locked -- -D warnings
      # The module and its notice, as the sync server serves them.
      - run: scripts/build-account-web.sh --debug
      # Chrome with a virtual WebAuthn authenticator signs up with a
      # passkey, adds another and signs in with each through the module.
      - name: Run account-web's browser test
        run: cargo test -p account-web --test browser --locked -- --ignored
        env:
          NOURA_CHROME: /usr/bin/google-chrome

  dependency-audit:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - run: rustc --version
      - uses: taiki-e/install-action@76c2e6406e52637deed7160d77bded76bd83e06e # v2.87.14
        with: { tool: cargo-deny@0.20.2 }
      # Checks advisories, bans, licenses, and sources. Bans needs version
      # requirements on every workspace path dependency.
      - run: cargo deny check
      # The collaboration sandbox's guest and fuzz crates sit outside the
      # workspace with lockfiles of their own, and the guest's crates ship
      # inside the app's module.
      - run: scripts/check-collab-sandbox.sh audit

  # The TypeScript author kit's packages as authors get them: their npm
  # dependencies' licenses and advisories, and the packed archives
  # installed into a fresh project that checks, tests and packages the
  # template.
  typescript-kit-packages:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: Install the TypeScript author kit
        working-directory: sdk/typescript
        run: npm ci --no-audit --no-fund
      # Mirrors deny.toml's allow list, with BlueOak-1.0.0, a permissive
      # license some npm tools use.
      - name: Check the kit's npm licenses
        working-directory: sdk/typescript
        run: npm run licenses
      # Only what the published packages install: the test and license
      # tools are dev dependencies that never reach a plugin author's project.
      - name: Check the kit's npm advisories
        working-directory: sdk/typescript
        run: npm run advisories
      - name: Pack the kit and build the template from the packed archives
        working-directory: sdk/typescript
        run: npm run check:packed

  # The plugin interface reference comes from the WIT's doc comments.
  plugin-reference:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@76c2e6406e52637deed7160d77bded76bd83e06e # v2.87.14
        with: { tool: wit-bindgen-cli@0.63.0 }
      - name: Check that the reference matches the WIT
        run: |
          scripts/plugin-reference.sh
          # Mark new pages, such as one for a new interface version, so
          # the diff shows them too.
          git add --intent-to-add -- docs/plugins/reference
          git diff --exit-code -- docs/plugins/reference

  # The one check branch protection requires. It fails when a job failed or
  # was cancelled, and counts a job that `changes` skipped as passing. When
  # it passes it records the tree this run tested as the artifact
  # ci-tree-<tree>, which a push to main and the release workflow accept as
  # proof that CI passed on that tree (.github/scripts/ci-evidence.sh).
  ci-passed:
    name: CI passed
    if: always()
    needs:
      - changes
      - secret-scan
      - website
      - lint
      - build
      - test
      - extras
      - packages
      - static-server
      - server-image
      - sqlx-offline-data
      - postgres
      - restore-fleet
      - editor-dependencies
      - sync-protocol
      - collab-sandbox
      - account-web
      - dependency-audit
      - typescript-kit-packages
      - plugin-reference
    runs-on: ubuntu-latest
    steps:
      - name: Check that every job passed or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed="$(jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key): \(.value.result)"' <<< "$NEEDS")"
          if [ -n "$failed" ]; then
            echo "::error::These jobs didn't pass: ${failed//$'\n'/, }"
            exit 1
          fi
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
      - name: Find the tested tree
        id: tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tree="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$GITHUB_SHA" --jq .tree.sha)"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID tested $GITHUB_SHA, tree $tree" > ci-tree.txt
          cat ci-tree.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-tree-${{ steps.tree.outputs.tree }}
          path: ci-tree.txt
          retention-days: 90
          overwrite: true
