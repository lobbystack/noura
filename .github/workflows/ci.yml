name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: gitleaks.toml
          GITLEAKS_VERSION: 8.30.1

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: 1.3.14 }
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run check:website
      - run: bun run build:website

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # rustup reads the version and components from rust-toolchain.toml.
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - run: rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo build --workspace --locked
      # Trial S7 loads a Rust and a TypeScript hello plugin in plugin-host's
      # tests. jco needs Node and npm, which AGENTS.md allows only for
      # sdk/typescript.
      - name: Install the WebAssembly component target
        run: rustup target add wasm32-wasip2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdk/typescript/s7-hello/package-lock.json
      - name: Build the trial S7 plugins
        shell: bash
        run: bash crates/plugin-host/trial/build-plugins.sh
      # The hello plugin and plugin-host's test plugins, which the plugin
      # tests in plugin-host, app-core and app-ui load.
      - name: Build the plugins
        shell: bash
        run: bash crates/plugin-sdk/build-plugins.sh
      - run: cargo test --workspace --locked
        env:
          NOURA_S7_REQUIRE_PLUGINS: '1'
          NOURA_REQUIRE_PLUGINS: '1'
      # A report, not a gate: each checkpoint enforces the budget on the
      # owner's Mac.
      - name: Report the file tree's frame times
        if: matrix.os == 'macos-latest'
        run: cargo test -p app-ui --release --locked --test tree_scale -- --ignored --nocapture
      # Also a report: the 95th-percentile keystroke-to-frame time of typing
      # in the 1 MB note, against the 16 ms budget.
      - name: Report the editor's typing time on a 1 MB note
        if: matrix.os == 'macos-latest'
        run: cargo bench -p editor-egui --locked --bench typing

  # Release checks: build each desktop package with cargo-packager, sign it
  # with a throwaway updater key, install or mount it, and launch the app to
  # its first window.
  packages:
    strategy:
      fail-fast: false
      matrix:
        # The release builds Linux packages on the oldest supported Ubuntu.
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: { key: packages }
      - uses: taiki-e/install-action@76c2e6406e52637deed7160d77bded76bd83e06e # v2.87.14
        with: { tool: 'cargo-packager@0.11.8,cargo-about@0.9.2' }
      # libfuse2 runs AppImages, including the tools cargo-packager uses to
      # build one. Xvfb and Mesa give the app a display and a GPU.
      - name: Install the Linux packaging and display tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 xvfb mesa-vulkan-drivers libegl1 libxkbcommon-x11-0
      - name: Build and sign the packages
        shell: bash
        run: |
          password="$(openssl rand -hex 16)"
          cargo packager signer generate --ci --password "$password" --path "$RUNNER_TEMP/updater.key"
          export CARGO_PACKAGER_SIGN_PRIVATE_KEY="$RUNNER_TEMP/updater.key"
          export CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD="$password"
          scripts/package-desktop.sh
      - name: Check that each update bundle has a signature
        shell: bash
        run: |
          shopt -s nullglob
          bundles=(target/release/*.app.tar.gz target/release/*.msi target/release/*.AppImage)
          if [ "${#bundles[@]}" -eq 0 ]; then
            echo "::error::No update bundle was built."
            exit 1
          fi
          for bundle in "${bundles[@]}"; do
            test -s "$bundle.sig" || { echo "::error::$bundle has no signature."; exit 1; }
          done
      - name: Install each package and launch it
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a scripts/check-desktop-packages.sh
          else
            scripts/check-desktop-packages.sh
          fi

  static-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain and the musl target
        run: |
          rustup toolchain install
          rustup target add x86_64-unknown-linux-musl
      - run: rustc --version
      - name: Install the musl C compiler
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: { key: musl }
      - run: cargo build -p sync-server --release --locked --target x86_64-unknown-linux-musl
      - name: Check that the server is one static binary that starts
        run: |
          binary=target/x86_64-unknown-linux-musl/release/sync-server
          file "$binary"
          program_headers="$(readelf --program-headers --wide "$binary")"
          if grep -q INTERP <<<"$program_headers"; then
            echo "::error::$binary asks for a dynamic loader."
            exit 1
          fi
          dynamic_section="$(readelf --dynamic --wide "$binary")"
          if grep -q '(NEEDED)' <<<"$dynamic_section"; then
            grep '(NEEDED)' <<<"$dynamic_section"
            echo "::error::$binary needs shared libraries."
            exit 1
          fi
          "$binary"

  editor-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - run: rustc --version
      # editor-core has no UI dependency; neither editor crate reaches
      # Lockbook's crates, a git source, a mobile host library or an HTTP
      # client; the build holds one wgpu version.
      - run: scripts/check-editor-deps.sh

  sync-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain and the WebAssembly target
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
      - run: rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: { key: wasm }
      # sync-protocol holds no filesystem, socket or database crate and builds
      # for account-web's WebAssembly target (sync-v2.md §4). Its published
      # test vectors and fixtures run with the workspace tests.
      - run: scripts/check-sync-protocol.sh

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - run: rustc --version
      - uses: taiki-e/install-action@76c2e6406e52637deed7160d77bded76bd83e06e # v2.87.14
        with: { tool: cargo-deny@0.20.2 }
      # Checks advisories, bans, licenses, and sources. Bans needs version
      # requirements on every workspace path dependency.
      - run: cargo deny check
