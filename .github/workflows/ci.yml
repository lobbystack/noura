name: CI

on:
  push:
  pull_request:

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.14 }
      - uses: dtolnay/rust-toolchain@stable
        with: { toolchain: '1.91', targets: wasm32-unknown-unknown }
      - name: Restore wasm-bindgen CLI
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen*
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: ${{ runner.os }}-${{ runner.arch }}-wasm-bindgen-cli-0.2.127
      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - run: bun install --frozen-lockfile
      - run: bunx license-checker-rseidelsohn --production --excludePrivatePackages --onlyAllow 'MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;CC0-1.0;OFL-1.1;Unicode-3.0;0BSD;BlueOak-1.0.0'
      - run: bun run check
      - run: bun test
      - run: bun run build

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          {
            toolchain: '1.91',
            components: 'rustfmt,clippy',
            targets: wasm32-unknown-unknown,
          }
      - name: Restore wasm-bindgen CLI
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen*
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: ${{ runner.os }}-${{ runner.arch }}-wasm-bindgen-cli-0.2.127
      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.14 }
      - run: bun install --frozen-lockfile
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Build desktop application
        run: bun run tauri build --no-bundle
      - name: Smoke-test Linux desktop process
        if: runner.os == 'Linux'
        run: |
          set +e
          xvfb-run -a timeout 10s target/release/noura-desktop
          status=$?
          test "$status" -eq 124
      - name: Verify generated TypeScript bindings
        if: runner.os == 'Linux'
        run: bash scripts/sync-bindings.sh && git diff --exit-code -- crates/local-core/bindings packages/shared/src/generated

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { toolchain: '1.91' }
      - run: cargo install cargo-deny --locked
      - run: cargo deny check licenses advisories
