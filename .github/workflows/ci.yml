name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: gitleaks.toml
          GITLEAKS_VERSION: 8.30.1

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: 1.3.14 }
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run check:website
      - run: bun run build:website

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # rustup reads the version and components from rust-toolchain.toml.
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - run: rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo build --workspace --locked
      # Trial S7 loads a Rust and a TypeScript hello plugin in plugin-host's
      # tests. jco needs Node and npm, which AGENTS.md allows only for
      # sdk/typescript.
      - name: Install the WebAssembly component target
        run: rustup target add wasm32-wasip2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdk/typescript/s7-hello/package-lock.json
      - name: Build the trial S7 plugins
        shell: bash
        run: bash crates/plugin-host/trial/build-plugins.sh
      - run: cargo test --workspace --locked
        env:
          NOURA_S7_REQUIRE_PLUGINS: '1'
      # A report, not a gate: each checkpoint enforces the budget on the
      # owner's Mac.
      - name: Report the file tree's frame times
        if: matrix.os == 'macos-latest'
        run: cargo test -p app-ui --release --locked --test tree_scale -- --ignored --nocapture

  static-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain and the musl target
        run: |
          rustup toolchain install
          rustup target add x86_64-unknown-linux-musl
      - run: rustc --version
      - name: Install the musl C compiler
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: { key: musl }
      - run: cargo build -p sync-server --release --locked --target x86_64-unknown-linux-musl
      - name: Check that the server is one static binary that starts
        run: |
          binary=target/x86_64-unknown-linux-musl/release/sync-server
          file "$binary"
          program_headers="$(readelf --program-headers --wide "$binary")"
          if grep -q INTERP <<<"$program_headers"; then
            echo "::error::$binary asks for a dynamic loader."
            exit 1
          fi
          dynamic_section="$(readelf --dynamic --wide "$binary")"
          if grep -q '(NEEDED)' <<<"$dynamic_section"; then
            grep '(NEEDED)' <<<"$dynamic_section"
            echo "::error::$binary needs shared libraries."
            exit 1
          fi
          "$binary"

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - run: rustc --version
      - uses: taiki-e/install-action@76c2e6406e52637deed7160d77bded76bd83e06e # v2.87.14
        with: { tool: cargo-deny@0.20.2 }
      # Checks advisories, bans, licenses, and sources. Bans needs version
      # requirements on every workspace path dependency.
      - run: cargo deny check
