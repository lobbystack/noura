name: Server integration
on:
  push:
  pull_request:
jobs:
  postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: noura_test
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: noura_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U noura_test -d noura_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NOURA_TEST_DATABASE_URL: postgres://noura_test:test_only@localhost:5432/noura_test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '1.3.14' }
      - run: bun install --frozen-lockfile
      - run: bun run --filter @noura/server check
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build -p local-core --examples --locked
      - run: cargo run -p local-core --example relay_authorization_probe --locked
      - run: bun run --filter @noura/server test:integration
        env:
          NOURA_NATIVE_PROBE: ${{ github.workspace }}/target/debug/examples/sync_probe
          NOURA_NATIVE_SIGNIN_PROBE: ${{ github.workspace }}/target/debug/examples/signin_probe
          NOURA_NATIVE_KEYS_PROBE: ${{ github.workspace }}/target/debug/examples/keys_probe
      - run: bun run --filter @noura/server build
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client-16
      - run: bun run --filter @noura/server test:restore
        env:
          NOURA_TEST_PG_BIN: /usr/lib/postgresql/16/bin
      - run: docker build -f apps/server/Dockerfile -t noura-server:test .
