name: Server integration
on:
  push:
  pull_request:
jobs:
  postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: noura_test
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: noura_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U noura_test -d noura_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NOURA_TEST_DATABASE_URL: postgres://noura_test:test_only@localhost:5432/noura_test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '1.3.14' }
      - run: bun install --frozen-lockfile
      - run: bun run --filter @noura/server check
      - uses: dtolnay/rust-toolchain@stable
        with: { toolchain: '1.91', targets: wasm32-unknown-unknown }
      - name: Restore wasm-bindgen CLI
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen*
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: ${{ runner.os }}-${{ runner.arch }}-wasm-bindgen-cli-0.2.127
      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - run: cargo build -p local-core --examples --locked
      - run: cargo run -p local-core --example relay_authorization_probe --locked
      - run: bun run --filter @noura/server test:integration
        env:
          NOURA_NATIVE_PROBE: ${{ github.workspace }}/target/debug/examples/sync_probe
          NOURA_NATIVE_SIGNIN_PROBE: ${{ github.workspace }}/target/debug/examples/signin_probe
          NOURA_NATIVE_KEYS_PROBE: ${{ github.workspace }}/target/debug/examples/keys_probe
      - name: Realtime collaboration load gate
        run: bun run --filter @noura/server test:collaboration-load
        env:
          NOURA_LOAD_FORCE_RECONNECT_BATCH: '1'
          NOURA_LOAD_FORCE_RECOVERY_BATCH: '1'
          NOURA_LOAD_P95_BUDGET_MS: '3000'
      - run: bun run --filter @noura/app check
      - run: bun run --filter @noura/server build:release
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client-16
      - run: bun run --filter @noura/server test:restore
        env:
          NOURA_TEST_PG_BIN: /usr/lib/postgresql/16/bin
      - run: docker build -f apps/server/Dockerfile -t noura-server:test .
