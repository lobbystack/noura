name: Fuzz

# Runs the collaboration sandbox's fuzz targets (crates/collab-sandbox/fuzz)
# for a fixed time each night. A crash fails the run, which keeps every
# crashing input as a regression case: it copies the inputs into
# crates/collab-sandbox/fuzz/regressions, where
# crates/collab-sandbox/tests/fuzz.rs and the guest's tests replay them,
# pushes them to a branch and links a pull request from the run's summary.
on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: fuzz
  cancel-in-progress: false

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      SECONDS_PER_TARGET: '600'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - run: rustc --version
      # Without a sanitizer, cargo-fuzz builds on the stable toolchain.
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      # A build that fails here fails the job, where in the loop below it
      # would count as a crash. The runs reuse this build.
      - name: Build the targets
        working-directory: crates/collab-sandbox
        run: cargo fuzz build --sanitizer none
      - name: Run each target
        id: run
        shell: bash
        run: |
          cd crates/collab-sandbox
          found=0
          for target in verdict record writer_record guest_record guest_writer_record; do
            if ! cargo fuzz run --sanitizer none "$target" -- \
              -max_total_time="$SECONDS_PER_TARGET" -rss_limit_mb=4096 -timeout=60; then
              found=1
            fi
            # The guest targets build the sandbox's own records, so their
            # crashes share the sandbox targets' folders, which both replay.
            folder="${target#guest_}"
            mkdir -p "fuzz/regressions/$folder"
            for input in fuzz/artifacts/"$target"/*; do
              if [ -f "$input" ]; then
                cp "$input" "fuzz/regressions/$folder/"
              fi
            done
          done
          echo "found=$found" >> "$GITHUB_OUTPUT"
      # The repository doesn't let workflows open pull requests, so the
      # summary links one to open by hand, which also starts its CI.
      - name: Keep the crashing inputs as regression cases
        if: steps.run.outputs.found == '1'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add crates/collab-sandbox/fuzz/regressions
          if git diff --cached --quiet; then
            echo "The fuzz run failed with no crashing input to keep: see the log of **Run each target**." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="fuzz/regressions-$GITHUB_RUN_ID"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git commit -m "Keep the inputs fuzz run $GITHUB_RUN_ID crashed on as regression cases"
          git push "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" "$branch"
          {
            echo "### Fuzz run $GITHUB_RUN_ID crashed"
            echo
            echo "Branch \`$branch\` keeps these inputs:"
            echo
            git show --name-only --format= HEAD | while read -r input; do
              echo "- \`$input\`"
            done
            echo
            echo "[Open a pull request]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$GITHUB_REF_NAME...$branch?expand=1) to add them. Its tests fail until the sandbox handles them."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail on a crash
        if: steps.run.outputs.found == '1'
        run: exit 1
