name: Collaboration soak

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 0'

permissions:
  contents: read

concurrency:
  group: collaboration-soak
  cancel-in-progress: false

jobs:
  realtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: noura_test
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: noura_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U noura_test -d noura_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NOURA_TEST_DATABASE_URL: postgres://noura_test:test_only@localhost:5432/noura_test
      NOURA_SOAK_SECONDS: '3600'
      NOURA_LOAD_CLIENTS: '100'
      NOURA_LOAD_WRITERS: '20'
      NOURA_LOAD_RTT_MS: '100'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: '1.3.14' }
      - run: bun install --frozen-lockfile
      - run: bun run --filter @noura/server check
      - name: One-hour realtime collaboration soak
        run: bun run --filter @noura/server test:collaboration-load
