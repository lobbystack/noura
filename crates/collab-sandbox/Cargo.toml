[package]
name = "collab-sandbox"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Runs the sandbox on Wasmtime's Pulley interpreter as well as Cranelift.
# Verdicts and fuel counts must agree on both.
pulley = ["plugin-host/pulley"]
# The hooks the sandbox's own tests drive: a writer's balance, the thread's
# clock, a held thread, a trapping integration and the backend a run tests.
# The app never turns it on.
test-support = []

[dependencies]
# Hashes the guest module the sandbox runs, against the pinned hash.
blake3.workspace = true
# The editor's side of a text-mode note, which SandboxDocument implements.
editor-core = { version = "0.2.0", path = "../editor-core" }
plugin-host = { version = "0.2.0", path = "../plugin-host" }
# Builds the Wasmtime operator cost table from the costs the fixture records.
serde_json.workspace = true
sync-protocol = { version = "0.2.0", path = "../sync-protocol" }
thiserror.workspace = true
wasmtime.workspace = true

[dev-dependencies]
# The sandbox itself with its test hooks, for the integration tests.
collab-sandbox = { version = "0.2.0", path = ".", features = ["test-support"] }
# The Yjs and yrs interop fixtures hold their updates in base64.
base64.workspace = true
# The limits test maps its large blocks itself, to measure memory in use.
libc.workspace = true
proptest.workspace = true
serde_json.workspace = true
wasmtime = { workspace = true, features = ["wat"] }
# yrs outside the sandbox, to compare what the sandbox does with what yrs
# does on its own. The workspace's copy has `small-client`, which holds the
# 32-bit client IDs of the Yjs and yrs interop fixtures.
yrs.workspace = true
