[package]
name = "editor-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
comrak.workspace = true
editor-core = { version = "0.2.0", path = "../editor-core" }
egui.workspace = true
egui-wgpu.workspace = true
glyphon.workspace = true
serde.workspace = true
tracing.workspace = true
unicode-linebreak.workspace = true
unicode-segmentation.workspace = true

[dev-dependencies]
atomic-write-file.workspace = true
eframe.workspace = true
egui_kittest = { workspace = true, features = ["wgpu"] }
pollster = "1"
proptest.workspace = true
rand.workspace = true
serde_json.workspace = true
# The typing benchmark also replays with the system spell checker on.
spell-check = { version = "0.2.0", path = "../spell-check" }
tempfile.workspace = true
# The byte-identity tests open and save notes the way Noura does.
workspace-format = { version = "0.2.0", path = "../workspace-format" }

# Replays recorded keystrokes on the 1 MB note and reports the
# keystroke-to-frame time.
[[bench]]
name = "typing"
harness = false

# Runs the example's save tests with `cargo test`.
[[example]]
name = "editor"
test = true
