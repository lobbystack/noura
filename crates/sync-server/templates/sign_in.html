{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<h1>Sign in</h1>
<form method="post" action="/account/email-link" data-passkey="sign-in">
<label for="email">Email</label>
<input id="email" name="email" type="email" autocomplete="username webauthn" required>
<button type="button" data-passkey-start hidden>Sign in with a passkey</button>
<button type="submit" class="link-button">Email me a sign-in link</button>
<p class="status" data-status role="status"></p>
</form>
<p class="aside">New to Noura? <a href="/account/sign-up">Create an account</a></p>
{% endblock %}
