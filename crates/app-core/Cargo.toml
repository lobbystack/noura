[package]
name = "app-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Lets tests force the native watcher to fail or deliver chosen events.
# Never enabled in a shipped build; the tests turn it on below.
test-hooks = ["local-core/test-hooks"]

[dependencies]
# Finds the workspace's names in log lines for Copy diagnostics.
aho-corasick.workspace = true
atomic-write-file.workspace = true
directories.workspace = true
# Tells a calendar date property from text shaped like one, and reads this
# computer's clock in its time zone for the Inbox's greeting.
jiff.workspace = true
jsonschema.workspace = true
local-core = { version = "0.2.0", path = "../local-core" }
nucleo-matcher.workspace = true
plugin-host = { version = "0.2.0", path = "../plugin-host" }
# The sync service's HTTP client for the v2 API.
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sync-key-envelope = { version = "0.2.0", path = "../sync-key-envelope" }
sync-protocol = { version = "0.2.0", path = "../sync-protocol" }
# The locale calendar grids name months, weekdays and times in.
sys-locale.workspace = true
thiserror.workspace = true
tracing.workspace = true
unicode-normalization.workspace = true
# The workspace format's date and date-time rules, which plugin input
# values follow.
workspace-format = { version = "0.2.0", path = "../workspace-format" }

[dev-dependencies]
app-core = { path = ".", features = ["test-hooks"] }
# The sync tests put a tampering proxy between the client and the server.
axum.workspace = true
# The tests record which folders each change syncs.
local-core = { version = "0.2.0", path = "../local-core", features = ["durability-probe"] }
# Search treats arbitrary typed text as plain words.
proptest.workspace = true
# The tests stop the index from accepting writes.
rusqlite.workspace = true
serde_yaml_ng.workspace = true
# The sync tests run the real server on SQLite in-process.
sync-server = { version = "0.2.0", path = "../sync-server" }
sync-store = { version = "0.2.0", path = "../sync-store" }
sync-store-sqlite = { version = "0.2.0", path = "../sync-store-sqlite" }
tempfile.workspace = true
tokio.workspace = true
# The in-memory credential store of the sync tests.
zeroize.workspace = true

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem"] }
