[package]
name = "kit-plugin"
description = "A test plugin whose pages hold a list, a table, a form, menus and a virtual list."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Moves the calendar page's period by a month, a week or a day.
jiff = { version = "0.2", default-features = false, features = ["std"] }
plugin-sdk = { version = "0.2.0", path = "../../../plugin-sdk" }
