[package]
name = "calendar-plugin"
description = "The Calendar plugin: month, week and day views of every dated object, and the Inbox's Next 7 days."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Days, instants and the device's time zone. Plugins get no file access,
# so the time zone database is compiled in instead of read from the
# system, and nothing reads the system's clock or zone.
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always"] }
plugin-sdk = { version = "0.2.0", path = "../../plugin-sdk" }
serde_json.workspace = true

[dev-dependencies]
# Reads the shared queries fixture's files as the host reads them, for the
# calendar cases. Tests only: the plugin reaches files through the host.
workspace-format = { version = "0.2.0", path = "../../workspace-format" }
