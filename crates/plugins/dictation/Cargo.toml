[package]
name = "dictation-plugin"
description = "The Dictation plugin: a global shortcut that records what you say, turns it into text on this device and pastes it into the app you're typing in."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# English names for the language codes in the Language submenu, as Handy
# names them. Apache-2.0.
isolang = "2.4"
# Soundex, for custom words that sound like what the model heard, as
# Handy matches them. MIT.
natural = { version = "0.5", default-features = false }
plugin-sdk = { version = "0.3.3", path = "../../plugin-sdk" }
serde_json.workspace = true
# Levenshtein distance, for custom words spelled close to what the model
# heard, as Handy matches them. MIT.
strsim = "0.11"

[dev-dependencies]
# Checks the settings type's schema and what the plugin writes against the
# workspace format. Tests only: the plugin reaches files through the host.
workspace-format = { version = "0.3.3", path = "../../workspace-format" }
