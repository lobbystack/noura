# Gitleaks configuration for the Noura repository.
#
# Extend the default rules, then allowlist only deterministic, synthetic
# material that is intentional in tree. Nothing here permits a real credential.
[extend]
useDefault = true

[[allowlists]]
description = "Deterministic workspace-format conformance fixtures, test vectors and the synthetic ChatGPT test signing key"
paths = [
	'''(^|/)docs/workspace-format/fixtures/.*''',
	'''(^|/)crates/sync-key-envelope/tests/vectors/.*''',
	'''(^|/)crates/local-core/tests/fixtures/chatgpt-test-signing-key\.pk8''',
]

[[allowlists]]
description = "Synthetic age identity in the recovery fixture regenerator (test-only)"
regexTarget = "match"
regexes = [
	'''AGE-SECRET-KEY-1GQ9778VQXMMJVE8SK7J6VT8UJ4HDQAJUVSFCWCM02D8GEWQ72PVQ2Y5J33''',
]

[[allowlists]]
description = "The cipher's name in the sync spec, which reads as a key after the word key"
regexes = [
	'''^XChaCha20-Poly1305$''',
]
