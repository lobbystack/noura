[workspace]
resolver = "2"
members = ["crates/local-core", "crates/mcp-server", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.91"

[workspace.dependencies]
age = { version = "=0.12.1", default-features = false }
aes-gcm = "=0.10.3"
base64 = "0.22"
bech32 = "=0.11.1"
sha2 = "=0.10.9"
ed25519-dalek = { version = "=2.2.0", features = ["rand_core"] }
zeroize = { version = "1", features = ["derive"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
atomic-write-file = "0.3.1"
blake3 = "1.8"
directories = "6"
diffy = "=0.5.1"
fs2 = "0.4"
futures = "0.3"
genai = "=0.6.5"
ignore = "0.4"
jiff = { version = "0.2", features = ["serde"] }
keyring = "4"
notify = "8"
pulldown-cmark = "0.13"
rusqlite = { version = "0.37", features = ["bundled-full", "serde_json"] }
rmcp = { version = "3.1", features = ["server", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
slug = "0.1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ts-rs = { version = "11", features = ["serde-compat"] }
ulid = { version = "1", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
