[licenses]
# The owner approves every license added here before it lands. OFL-1.1 and
# Ubuntu-font-1.0 cover egui's default fonts, and BSL-1.0 covers arboard's
# Windows clipboard crates (both approved 2026-10-20).
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "BSL-1.0", "ISC", "Unicode-3.0", "CC0-1.0", "CDLA-Permissive-2.0", "Zlib", "MPL-2.0", "OFL-1.1", "Ubuntu-font-1.0"]
confidence-threshold = 0.8

[advisories]
yanked = "deny"
# Never ignore a Wasmtime advisory: plugin-host applies Wasmtime patch releases
# as soon as an advisory lands, so an unpatched one must fail the build.
ignore = [
  # Transitive unmaintained notices with no safe upgrade in the locked stack.
  "RUSTSEC-2024-0436", # paste, through genai
  "RUSTSEC-2024-0449", # unsafe-libyaml, through serde_yaml_ng
  "RUSTSEC-2026-0370", # zvariant, through zbus
  "RUSTSEC-2026-0371", # zbus_names, through zbus
  "RUSTSEC-2026-0372", # zvariant_derive, through zbus
  "RUSTSEC-2026-0374", # basic-toml, through age's i18n-embed
  "RUSTSEC-2026-0192", # ttf-parser, through glyphon's cosmic-text and fontdb
  # yrs 0.26.0 enables `small-client` for Yjs interoperability and currently
  # depends on unmaintained smallstr 0.3.1. This is a maintenance advisory,
  # not a reported vulnerability; decoder isolation remains a release gate.
  "RUSTSEC-2026-0215",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
