[licenses]
# The owner approves every license added here before it lands. OFL-1.1 and
# Ubuntu-font-1.0 cover egui's default fonts, and BSL-1.0 covers arboard's
# Windows clipboard crates (both approved 2026-10-20). 0BSD covers
# interprocess's doctest-file and recvmsg; the spec approves BSD licenses.
# MIT-0 covers borrow-or-share, through jsonschema; the spec approves
# permissive licenses, and MIT-0 asks for no notice.
allow = ["MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "0BSD", "BSD-2-Clause", "BSD-3-Clause", "BSL-1.0", "ISC", "Unicode-3.0", "CC0-1.0", "CDLA-Permissive-2.0", "Zlib", "MPL-2.0", "OFL-1.1", "Ubuntu-font-1.0"]
confidence-threshold = 0.8

[advisories]
yanked = "deny"
# Never ignore a Wasmtime advisory: plugin-host applies Wasmtime patch releases
# as soon as an advisory lands, so an unpatched one must fail the build.
ignore = [
  # Transitive unmaintained notices with no safe upgrade in the locked stack.
  "RUSTSEC-2024-0436", # paste, through genai
  "RUSTSEC-2024-0449", # unsafe-libyaml, through serde_yaml_ng
  "RUSTSEC-2026-0370", # zvariant, through zbus
  "RUSTSEC-2026-0371", # zbus_names, through zbus
  "RUSTSEC-2026-0372", # zvariant_derive, through zbus
  "RUSTSEC-2026-0374", # basic-toml, through age's i18n-embed
  # proc-macro-error2, a build-time macro crate through age 0.11's
  # i18n-embed-fl. local-core's v1 sync stays on age 0.11: age 0.12 needs
  # ml-kem 0.2 and a kem pre-release that can't share a lockfile with the kem
  # 0.3 under hpke 0.14's X-Wing (sync-v2.md §3).
  "RUSTSEC-2026-0173",
  # proc-macro-error, through the GTK crates the `drag` crate uses on Linux.
  # The desktop crate uses `drag` on macOS and Windows only, so no build
  # compiles them, but cargo deny reads every target's dependencies.
  "RUSTSEC-2024-0370",
  "RUSTSEC-2026-0192", # ttf-parser, through glyphon's cosmic-text and fontdb
  # yrs 0.26.0 enables `small-client` for Yjs interoperability and currently
  # depends on unmaintained smallstr 0.3.1. This is a maintenance advisory,
  # not a reported vulnerability; decoder isolation remains a release gate.
  "RUSTSEC-2026-0215",
  # crypto-bigint 0.5.5's timing leaks, through age 0.12.1's P-256 tag
  # recipients. age has no release on crypto-bigint 0.7.6 yet, and Noura
  # encrypts and decrypts with X25519 keys only, so no P-256 arithmetic
  # runs on its secrets. Drop this once age moves to elliptic-curve 0.14.
  "RUSTSEC-2026-0387",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
