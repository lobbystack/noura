services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: noura
      POSTGRES_USER: noura
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U noura -d noura']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  migrate:
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
    command: [bun, migrate.js]
    environment: &server-environment
      DATABASE_URL: postgres://noura:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/noura
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET}
      SMTP_URL: ${SMTP_URL:?Set SMTP_URL}
      MAIL_FROM: ${MAIL_FROM:?Set MAIL_FROM}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
  server:
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
    environment: *server-environment
    volumes:
      - blobs:/data/blobs
    ports:
      - '127.0.0.1:1900:1900'
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          CMD,
          bun,
          -e,
          "const r=await fetch('http://localhost:1900/ready');process.exit(r.ok?0:1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
volumes:
  postgres:
  blobs:
