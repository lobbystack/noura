# cargo-about settings for the third-party license list that every desktop
# package ships. scripts/package-desktop.sh runs cargo-about with these
# settings and about.hbs. The accepted licenses match deny.toml's allow list;
# cargo-about fails when a crate needs a license that isn't listed here.
# MIT-0 covers borrow-or-share, through jsonschema; the spec approves
# permissive licenses, and MIT-0 asks for no notice.
accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "0BSD",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Unicode-3.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "Zlib",
    "MPL-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
# Build scripts and test helpers aren't part of the app.
ignore-build-dependencies = true
ignore-dev-dependencies = true
# Built-in clarifications for crates whose license files cargo-about can't
# read on its own.
workarounds = ["ring", "rustls", "wasmtime", "rustix"]
