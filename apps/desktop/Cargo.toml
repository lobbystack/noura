[package]
name = "desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The open workspace for humans and AI."
homepage = "https://noura.app"
repository = "https://github.com/lobbystack/noura"

[[bin]]
name = "noura"
path = "src/main.rs"

[dependencies]
app-core = { version = "0.2.0", path = "../../crates/app-core" }
app-ui = { version = "0.2.0", path = "../../crates/app-ui" }
auto-launch.workspace = true
cargo-packager-updater.workspace = true
eframe.workspace = true
# The note editor paints its text through eframe's wgpu renderer.
editor-egui = { version = "0.2.0", path = "../../crates/editor-egui" }
egui.workspace = true
# One running copy per user: a second launch asks the running copy to come
# forward through a local socket.
interprocess.workspace = true
logroller.workspace = true
# The native menu bar on macOS and Windows. Linux builds muda's no-op
# backend and shows no menu bar.
muda.workspace = true
# `noura mcp --workspace <folder>` serves the workspace to AI tools, and
# Settings tests that command.
noura-mcp = { version = "0.2.0", path = "../../crates/mcp-server" }
opener.workspace = true
rfd.workspace = true
# NSSpellChecker on macOS and ISpellChecker on Windows; nothing on Linux.
spell-check = { version = "0.2.0", path = "../../crates/spell-check" }
tracing.workspace = true
tracing-subscriber.workspace = true
winit.workspace = true

# A tree row dragged out of a window becomes a native drag through `drag`.
# On Linux the crate drags out through GTK, which winit windows don't use.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
drag.workspace = true

# While Finder drags files over a window, the window asks AppKit where the
# pointer is, since winit doesn't say. A row dragged out of a window other
# than the first starts its drag from AppKit's key window.
[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit = { workspace = true, features = ["std", "NSApplication", "NSEvent", "NSResponder", "NSScreen", "NSView", "NSWindow"] }
objc2-foundation = { workspace = true, features = ["std", "NSArray", "NSGeometry"] }

# While Explorer drags files over a window, the window asks Windows where
# the pointer is, since winit doesn't say. Every window carries the menu
# bar, and menu shortcuts go through the accelerator table of the window
# that got the key. A second launch lets the running copy bring its window
# to the front.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

# The S6 desktop trial (ticket 04) lives in examples/desktop_trial.
[[example]]
name = "desktop_trial"
test = true

[dev-dependencies]
base64.workspace = true
# The eframe feature runs `App::logic` before `App::ui` in each step, as
# eframe does.
egui_kittest = { workspace = true, features = ["eframe"] }
minisign.workspace = true
serde_json.workspace = true
tempfile.workspace = true

# The smoke run sends menu shortcuts through AppKit's main menu.
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2.workspace = true
objc2-app-kit = { workspace = true, features = ["std", "NSApplication", "NSEvent", "NSGraphicsContext", "NSMenu", "NSResponder"] }
objc2-foundation = { workspace = true, features = ["std", "NSGeometry", "NSString"] }

# cargo-packager reads this. scripts/package-desktop.sh builds the binary and
# the plugins, generates the license list and runs cargo-packager. The release workflow
# adds the macOS signing identity at build time.
[package.metadata.packager]
product-name = "Noura"
identifier = "org.noura.desktop"
publisher = "Noura"
category = "Productivity"
license-file = "../../LICENSE"
icons = [
    "icons/32x32.png",
    "icons/64x64.png",
    "icons/128x128.png",
    "icons/128x128@2x.png",
    "icons/icon.icns",
    "icons/icon.ico",
]
resources = [
    { src = "packaging/THIRD_PARTY_LICENSES.html", target = "THIRD_PARTY_LICENSES.html" },
    { src = "packaging/plugins", target = "plugins" },
]

# winit and wgpu load these libraries when the app starts.
[package.metadata.packager.deb]
depends = [
    "libxkbcommon-x11-0",
    "libxcursor1",
    "libxrandr2",
    "libxi6",
    "libegl1",
    "libvulkan1",
]
