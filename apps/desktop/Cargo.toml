[package]
name = "desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The open workspace for humans and AI."
homepage = "https://noura.app"
repository = "https://github.com/lobbystack/noura"

[[bin]]
name = "noura"
path = "src/main.rs"

[dependencies]
app-core = { version = "0.3.1", path = "../../crates/app-core" }
app-ui = { version = "0.3.1", path = "../../crates/app-ui" }
auto-launch.workspace = true
# Global shortcuts for plugins, and Noura's menu bar or tray item.
global-hotkey.workspace = true
png = "0.18.1"
plugin-host = { version = "0.3.1", path = "../../crates/plugin-host" }
# Recording, transcribe.cpp and pasting (ADR 0006).
speech = { version = "0.3.1", path = "../../crates/speech" }
tray-icon.workspace = true
cargo-packager-updater.workspace = true
dunce.workspace = true
eframe.workspace = true
# The note editor paints its text through eframe's wgpu renderer.
editor-egui = { version = "0.3.1", path = "../../crates/editor-egui" }
egui.workspace = true
# One running copy per user: a second launch asks the running copy to come
# forward through a local socket.
interprocess.workspace = true
logroller.workspace = true
# The native menu bar on macOS and Windows. Linux builds muda's no-op
# backend and shows no menu bar.
muda.workspace = true
# `noura mcp --workspace <folder>` serves the workspace to AI tools, and
# Settings tests that command.
noura-mcp = { version = "0.3.1", path = "../../crates/mcp-server" }
opener.workspace = true
rfd.workspace = true
# NSSpellChecker on macOS and ISpellChecker on Windows; nothing on Linux.
spell-check = { version = "0.3.1", path = "../../crates/spell-check" }
tracing.workspace = true
tracing-subscriber.workspace = true
winit.workspace = true

# A tree row dragged out of a window becomes a native drag through `drag`.
# On Linux the crate drags out through GTK, which winit windows don't use.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
drag.workspace = true

# While Finder drags files over a window, the window asks AppKit where the
# pointer is, since winit doesn't say. A row dragged out of a window other
# than the first starts its drag from AppKit's key window.
#
# Notifications go through the User Notifications framework.
#
# The window's close, minimize and zoom buttons move into the rail.
[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
objc2.workspace = true
objc2-app-kit = { workspace = true, features = ["std", "NSApplication", "NSButton", "NSControl", "NSEvent", "NSPanel", "NSResponder", "NSScreen", "NSView", "NSWindow"] }
objc2-foundation = { workspace = true, features = ["std", "block2", "NSArray", "NSBundle", "NSError", "NSGeometry", "NSNotification", "NSOperation", "NSSet", "NSString"] }
objc2-user-notifications = { workspace = true, features = ["std", "block2", "UNNotification", "UNNotificationAction", "UNNotificationCategory", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationTrigger", "UNUserNotificationCenter"] }

# While Explorer drags files over a window, the window asks Windows where
# the pointer is, since winit doesn't say. Every window carries the menu
# bar, and menu shortcuts go through the accelerator table of the window
# that got the key. A second launch lets the running copy bring its window
# to the front.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
# Notifications are toasts through WinRT.
windows = { workspace = true, features = ["Data_Xml_Dom", "Foundation", "Foundation_Collections", "UI_Notifications", "Win32_System_Registry", "Win32_UI_Shell"] }

# Under Wayland the shortcuts go through the XDG GlobalShortcuts portal.
# Notifications go to the desktop's notification server over D-Bus.
[target.'cfg(target_os = "linux")'.dependencies]
ashpd.workspace = true
futures.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "sync", "time"] }

# The S6 desktop trial (ticket 04) lives in examples/desktop_trial.
[[example]]
name = "desktop_trial"
test = true

[dev-dependencies]
base64.workspace = true
# The eframe feature runs `App::logic` before `App::ui` in each step, as
# eframe does.
egui_kittest = { workspace = true, features = ["eframe"] }
minisign.workspace = true
serde_json.workspace = true
tempfile.workspace = true

# The smoke run sends menu shortcuts through AppKit's main menu.
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2.workspace = true
objc2-app-kit = { workspace = true, features = ["std", "NSApplication", "NSEvent", "NSGraphicsContext", "NSMenu", "NSResponder"] }
objc2-foundation = { workspace = true, features = ["std", "NSGeometry", "NSString"] }

# cargo-packager reads this. scripts/package-desktop.sh builds the binary and
# the plugins, generates the license list and runs cargo-packager.
[package.metadata.packager]
product-name = "Noura"
identifier = "org.noura.desktop"
publisher = "Noura"
category = "Productivity"
# No license-file: cargo-packager would show it as a click-through agreement
# when the DMG opens and in the MSI. The license ships as a resource instead.
icons = [
    "icons/32x32.png",
    "icons/64x64.png",
    "icons/128x128.png",
    "icons/128x128@2x.png",
    "icons/icon.icns",
    "icons/icon.ico",
]
resources = [
    { src = "../../LICENSE", target = "LICENSE" },
    { src = "packaging/THIRD_PARTY_LICENSES.html", target = "THIRD_PARTY_LICENSES.html" },
    { src = "icons/Assets.car", target = "Assets.car" },
    { src = "packaging/plugins", target = "plugins" },
]

# The layered macOS icon in icons/Assets.car, which the plist names.
#
# cargo-packager signs the app with the hardened runtime and these
# entitlements. "-" signs ad hoc, as a release without Apple credentials
# does, so CI tests that signature. The release workflow puts the Developer
# ID in its place when one is configured.
[package.metadata.packager.macos]
info-plist-path = "packaging/Info.plist"
signing-identity = "-"
entitlements = "packaging/Entitlements.plist"

# The AppImage takes Wayland and xkbcommon from the system. The host's Mesa
# drivers load into the app and need the host's libwayland-client: with the
# copy from the Ubuntu 22.04 build machine, no Vulkan or EGL driver loads
# on a newer system and the window can't open.
[package.metadata.packager.appimage]
excluded-libraries = ["libwayland-*", "libxkbcommon*"]

# winit and wgpu load these libraries when the app starts.
[package.metadata.packager.deb]
depends = [
    "libxkbcommon-x11-0",
    "libxcursor1",
    "libxrandr2",
    "libxi6",
    "libegl1",
    "libvulkan1",
    "libgtk-3-0t64 | libgtk-3-0",
    "libasound2t64 | libasound2",
    "libpulse0",
    "libayatana-appindicator3-1",
]
