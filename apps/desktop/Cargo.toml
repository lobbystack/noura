[package]
name = "desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The open workspace for humans and AI."
homepage = "https://noura.app"
repository = "https://github.com/lobbystack/noura"

[[bin]]
name = "noura"
path = "src/main.rs"

[dependencies]
app-core = { version = "0.2.0", path = "../../crates/app-core" }
app-ui = { version = "0.2.0", path = "../../crates/app-ui" }
cargo-packager-updater.workspace = true
eframe.workspace = true
rfd.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# The S6 desktop trial (ticket 04) lives in examples/desktop_trial. Its native
# menu and drag-out crates stay dev-dependencies until tickets 09 and 12 move
# them into the app.
[[example]]
name = "desktop_trial"
test = true

[dev-dependencies]
base64.workspace = true
egui.workspace = true
egui_kittest.workspace = true
minisign.workspace = true
muda.workspace = true
serde_json.workspace = true
tempfile.workspace = true
winit.workspace = true

# On Linux the drag crate drags out through GTK, which winit windows don't use.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dev-dependencies]
drag.workspace = true

# The smoke run sends menu shortcuts through AppKit's main menu.
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2.workspace = true
objc2-app-kit = { workspace = true, features = ["std", "NSApplication", "NSEvent", "NSGraphicsContext", "NSMenu", "NSResponder"] }
objc2-foundation = { workspace = true, features = ["std", "NSGeometry", "NSString"] }

[target.'cfg(target_os = "windows")'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_UI_WindowsAndMessaging"] }

# cargo-packager reads this. scripts/package-desktop.sh builds the binary,
# generates the license list and runs cargo-packager. The release workflow
# adds the macOS signing identity at build time.
[package.metadata.packager]
product-name = "Noura"
identifier = "org.noura.desktop"
publisher = "Noura"
category = "Productivity"
license-file = "../../LICENSE"
icons = [
    "icons/32x32.png",
    "icons/64x64.png",
    "icons/128x128.png",
    "icons/128x128@2x.png",
    "icons/icon.icns",
    "icons/icon.ico",
]
resources = [
    { src = "packaging/THIRD_PARTY_LICENSES.html", target = "THIRD_PARTY_LICENSES.html" },
]

# winit and wgpu load these libraries when the app starts.
[package.metadata.packager.deb]
depends = [
    "libxkbcommon-x11-0",
    "libxcursor1",
    "libxrandr2",
    "libxi6",
    "libegl1",
    "libvulkan1",
]
