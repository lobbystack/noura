[package]
name = "desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
app-core = { version = "0.2.0", path = "../../crates/app-core" }
app-ui = { version = "0.2.0", path = "../../crates/app-ui" }
eframe.workspace = true
egui.workspace = true
# The native menu bar on macOS and Windows. Linux builds muda's no-op
# backend and shows no menu bar.
muda.workspace = true
opener.workspace = true
rfd.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
winit.workspace = true

# Windows sends menu shortcuts through the menu's accelerator table.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true, features = ["Win32_UI_WindowsAndMessaging"] }

# The S6 desktop trial (ticket 04) lives in examples/desktop_trial. Its
# drag-out crate stays a dev-dependency until ticket 09 moves it into the app.
[[example]]
name = "desktop_trial"
test = true

[dev-dependencies]
egui_kittest.workspace = true
tempfile.workspace = true

# On Linux the drag crate drags out through GTK, which winit windows don't use.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dev-dependencies]
drag.workspace = true

# The smoke run sends menu shortcuts through AppKit's main menu.
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2.workspace = true
objc2-app-kit = { workspace = true, features = ["std", "NSApplication", "NSEvent", "NSGraphicsContext", "NSMenu", "NSResponder"] }
objc2-foundation = { workspace = true, features = ["std", "NSGeometry", "NSString"] }
